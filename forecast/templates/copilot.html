<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Widget</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Chatbot Widget Styles - Isolated to prevent conflicts */
        .chatbot-widget {
            position: fixed;
            bottom: 220px;
            right: 20px;
            z-index: 9999;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .chatbot-container {
            position: absolute;
            bottom: -100px;
            right: 50%;
            transform: translateX(50%);
            width: 300px;
            height: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }


        .chatbot-container.show {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .chatbot-toggle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #0B556A;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .chatbot-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
        }

        .chatbot-toggle:focus {
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .chatbot-toggle:active {
            transform: scale(0.95);
        }

        

        .chatbot-close {
            position: absolute;
            border-bottom-right-radius: 10px;
            right: 10px;
            background: #0B556A;
            border: none;
            color:red;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            width: 32px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
            z-index: 10;
        }

        .chatbot-close:hover {
            background: #0B556A;
        }

        .chatbot-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }



        /* Responsive adjustments */
        @media (max-width: 768px) {
            .chatbot-container {
                width: 320px;
                height: 450px;
                bottom: 70px;
                right: -10px;
            }
            
            .chatbot-widget {
                bottom: 100px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .chatbot-container {
                width: 85vw;
                height: 60vh;
                right: 2.5vw;
                bottom: 70px;
            }
        }

        /* Animation for icon transition */
        .chatbot-toggle i {
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .chatbot-toggle.active i {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>


    <!-- Chatbot Widget -->
    <div class="chatbot-widget">
        <!-- Toggle Button -->
        <button class="chatbot-toggle" id="chatbotToggle" type="button">
            <i class="fas fa-comment-dots"></i>
        </button>

        <!-- Chatbot Container -->
        <div class="chatbot-container" id="chatbotContainer">
            <button class="chatbot-close" id="chatbotClose" type="button">
                <i class="fas fa-times"></i>
            </button>
            <iframe 
                class="chatbot-iframe"
                src="https://copilotstudio.microsoft.com/environments/441040f4-3d01-e21a-8410-79808681d315/bots/cr7d8_testAgent/webchat?__version__=2"
                title="Test Agent Chatbot">
            </iframe>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Chatbot Widget JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            const chatbotToggle = document.getElementById('chatbotToggle');
            const chatbotContainer = document.getElementById('chatbotContainer');
            const chatbotClose = document.getElementById('chatbotClose');

            // Toggle chatbot visibility
            chatbotToggle.addEventListener('click', function() {
                const isVisible = chatbotContainer.classList.contains('show');
                
                if (isVisible) {
                    closeChatbot();
                } else {
                    openChatbot();
                }
            });

            // Close chatbot
            chatbotClose.addEventListener('click', function() {
                closeChatbot();
            });

            // Close chatbot when clicking outside
            document.addEventListener('click', function(event) {
                if (!event.target.closest('.chatbot-widget')) {
                    closeChatbot();
                }
            });

            // Functions
            function openChatbot() {
                chatbotContainer.classList.add('show');
                chatbotToggle.classList.add('active');
                chatbotToggle.style.display = 'none';
            }

            function closeChatbot() {
                chatbotContainer.classList.remove('show');
                chatbotToggle.classList.remove('active');
                chatbotToggle.style.display = 'flex';
            }

            // Optional: Auto-open chatbot after page load (remove if not needed)
            // setTimeout(function() {
            //     openChatbot();
            // }, 2000);
        });
    </script>
</body>
</html>
